# ===============================================================
# Titulo: Docker Compose - PostgreSQL Local
# Descricao: Configuracao Docker para PostgreSQL com PostGIS
# ===============================================================

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: espacovital-postgres
    environment:
      POSTGRES_DB: espacovital
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PGCLIENTENCODING: UTF8
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    command: 
      - "postgres"
      - "-c"
      - "client_encoding=UTF8"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local