# Título: Configuração Nixpacks - Espaço Vital
# Descrição: Configuração de build para Railway
# ===============================================================

[phases.setup]
nixPkgs = ["python312", "postgresql"]

[phases.install]
cmds = [
    "pip install --upgrade pip",
    "pip install -r requirements.txt"
]

[phases.build]
cmds = [
    "python manage.py collectstatic --noinput"
]

[start]
cmd = "PYTHONIOENCODING=utf-8 LANG=C.UTF-8 LC_ALL=C.UTF-8 python manage.py migrate --noinput && PYTHONIOENCODING=utf-8 LANG=C.UTF-8 LC_ALL=C.UTF-8 gunicorn espacovital.wsgi:application --bind 0.0.0.0:$PORT"