# ===============================================================
# Título: Configuração do Pytest - Espaço Vital
# Descrição: Define caminhos, configurações de cobertura e
#            quality gate de 80% para o pipeline de CI/CD
# ===============================================================

[pytest]

# ---------------------------------------------------------------
# Configuração do Django
# Aponta para o settings de desenvolvimento para rodar os testes
# ---------------------------------------------------------------
DJANGO_SETTINGS_MODULE = espacovital.settings

# ---------------------------------------------------------------
# Caminhos onde o pytest vai procurar testes
# Inclui todos os apps do projeto
# ---------------------------------------------------------------
testpaths =
    core
    terapeutas
    espacos
    terapias
    agendamentos
    planos

# ---------------------------------------------------------------
# Padrão de nomenclatura para arquivos e funções de teste
# ---------------------------------------------------------------
python_files = tests.py test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# ---------------------------------------------------------------
# Opções padrão que rodam em todo pytest
# --cov           → coleta cobertura de todos os apps
# --cov-report    → gera relatório no terminal e em XML (para CI)
# --cov-fail-under → QUALITY GATE: abaixo de 80% = falha = pipeline bloqueado
# -v              → output detalhado
# ---------------------------------------------------------------
addopts =
    --cov=.
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-fail-under=80
    -v
    -p no:capture